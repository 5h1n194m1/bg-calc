version: '3.8'
services:
  web:
    build: .
    container_name: laravel_bgcalc_web
    ports:
      - "8082:80" # Akses di localhost:8082
    volumes:
      - .:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.4
    container_name: laravel_bgcalc_db
    ports:
      - "3308:3306" # Port 3308 agar tidak bentrok
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bg_calc # Sesuaikan dengan nama databasemu
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: